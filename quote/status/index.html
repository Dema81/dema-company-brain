<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Your order — Quote Desk</title>
<meta name="description" content="Check where a translation order has got to: its stage, its delivery date and what it comes to.">
<link rel="icon" href="../dema-logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&amp;family=Figtree:wght@400;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap">
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Where a customer looks up the order they placed. The desk's board again,
   smaller: one tile to ask with, one to answer in.
   ────────────────────────────────────────────────────────────────────────── */

:root {
  --bg: #131a38;
  --surface: #1c244b;
  --surface-2: #232c57;
  --surface-3: #2a3463;
  --ink: #ffffff;
  --muted: #c9cee5;
  --line: #39406a;
  --accent: #34a9ee;
  --accent-ink: #0b1026;
  --accent-text: #8fd2f7;
  --good: #7fd6a8;
  --warn: #f2c66a;
  --alarm: #ffb4a8;

  --display: 'League Spartan', 'Segoe UI', system-ui, sans-serif;
  --text: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;

  --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
  --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
  --step-head: clamp(1.75rem, 1.2rem + 2.4vw, 3rem);

  --gap: 8px;
  --radius: 0px;
  --pad: 22px;

  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--text);
  font-size: var(--step-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

::placeholder { color: #8b94b8; opacity: 1; }
::selection { background: var(--accent); color: var(--accent-ink); }
input { caret-color: var(--accent); }
:root { scrollbar-color: var(--line) var(--bg); }

.board {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: var(--gap);
  padding: 12px;
  max-width: 980px;
  margin-inline: auto;
}

.tile {
  background: var(--surface);
  border-radius: var(--radius);
  padding: var(--pad);
  min-width: 0;
  grid-column: span 12;
}

.plate { background: #ffffff; border-radius: 2px; padding: 10px 14px; display: inline-flex; }
.plate img { display: block; height: 30px; width: auto; }

h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: var(--step-head);
  line-height: 0.95;
  letter-spacing: -0.01em;
  margin: 14px 0 6px;
  text-transform: uppercase;
}

.lede { color: var(--muted); margin: 0; max-width: 78ch; }

form { display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--gap); align-items: end; }

label {
  display: block;
  font-size: var(--step-small);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

input {
  font: inherit;
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface-3);
  color: var(--ink);
  border-radius: var(--radius);
  padding: 11px 13px;
}

#reference { font-family: var(--mono); text-transform: uppercase; }

button {
  font: inherit;
  font-size: var(--step-small);
  font-weight: 600;
  white-space: nowrap;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: var(--radius);
  padding: 12px 20px;
  cursor: pointer;
}

button:hover { filter: brightness(1.08); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.note { font-size: var(--step-small); color: var(--muted); margin: 14px 0 0; max-width: 78ch; }
.note.bad { color: var(--alarm); }

/* ─────────────────────────────────────────────────────────────── the answer */

.chip {
  display: inline-block;
  font-family: var(--display);
  font-weight: 700;
  font-size: var(--step-small);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: 1px solid var(--accent);
  color: var(--accent-text);
  padding: 5px 11px;
  margin-bottom: 14px;
}

.chip.done { border-color: var(--good); color: var(--good); }
.chip.doing { border-color: var(--warn); color: var(--warn); }

.ref { font-family: var(--mono); font-size: var(--step-lead); margin: 0 0 4px; }

dl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px 22px;
  margin: 18px 0 0;
}

dt {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

dd { margin: 2px 0 0; overflow-wrap: anywhere; }
dd.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

footer {
  grid-column: span 12;
  color: var(--muted);
  font-size: var(--step-small);
  padding: 4px 12px 24px;
  max-width: 78ch;
}

@media (max-width: 700px) {
  form { grid-template-columns: 1fr; }
  :root { --pad: 16px; }
}
</style>
</head>
<body>

<main class="board">

  <section class="tile">
    <span class="plate"><img src="../dema-logo.webp" alt="DEMA Solutions" width="120" height="30"></span>
    <h1>Your order</h1>
    <p class="lede">The reference is on the confirmation we sent you. The email is the one
      the order was placed with.</p>
  </section>

  <section class="tile">
    <form id="lookup" autocomplete="off">
      <div>
        <label for="reference">Reference</label>
        <input id="reference" name="reference" required spellcheck="false" placeholder="ORD-20261024-AB12">
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
      </div>
      <button type="submit" id="go">Look it up</button>
    </form>
    <p class="note" id="note" hidden></p>
  </section>

  <section class="tile" id="answer" hidden>
    <span class="chip" id="status"></span>
    <p class="ref" id="ref"></p>
    <p class="lede" id="project"></p>
    <dl id="rows"></dl>
  </section>

  <footer>
    Nothing here shows your billing details. If something looks wrong, reply to the
    confirmation email and the desk will pick it up.
  </footer>

</main>

<script>
'use strict';

/* The same web app the quote page sends orders to; here it answers one
   question about one order. */
var ORDERS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbxkQZuUjzsYWSpCs0DFl9gvUvT9sJkN2rIdePy2pZ9xpeRDRyhBVH6zQQUyTmhH143Rjw/exec';

function $(id) { return document.getElementById(id); }

function money(amount, currency) {
  try {
    return new Intl.NumberFormat('en-GB', {
      style: 'currency', currency: currency || 'EUR', currencyDisplay: 'code'
    }).format(amount);
  } catch (err) {
    return Number(amount).toFixed(2) + ' ' + (currency || 'EUR');
  }
}

function when(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return new Intl.DateTimeFormat('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  }).format(d);
}

function dueWords(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var a = new Date(); a.setHours(0, 0, 0, 0);
  var b = new Date(d.getTime()); b.setHours(0, 0, 0, 0);
  var days = Math.round((b - a) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  if (days < 0) return (-days) + ' days ago';
  return 'in ' + days + ' days';
}

function escapeHtml(value) {
  return String(value)
    .split('&').join('&amp;').split('<').join('&lt;')
    .split('>').join('&gt;').split('"').join('&quot;');
}

/* The desk writes the status by hand as the job moves, so it can say anything;
   the colour is a hint, and an unrecognised word simply gets the middle one. */
function statusClass(text) {
  var low = String(text).toLowerCase();
  if (low.indexOf('deliver') === 0 || low.indexOf('conseg') === 0 ||
      low.indexOf('done') === 0 || low.indexOf('complet') === 0) return 'chip done';
  if (low.indexOf('receiv') === 0 || low.indexOf('ricev') === 0) return 'chip';
  return 'chip doing';
}

function row(label, value) {
  if (value === '' || value === null || value === undefined) return '';
  return '<div><dt>' + escapeHtml(label) + '</dt><dd>' + escapeHtml(value) + '</dd></div>';
}

function numRow(label, value) {
  if (!value) return '';
  return '<div><dt>' + escapeHtml(label) + '</dt><dd class="num">' + escapeHtml(value) + '</dd></div>';
}

function show(order) {
  $('status').textContent = order.status || 'Received';
  $('status').className = statusClass(order.status);
  $('ref').textContent = order.reference;
  $('project').textContent = order.project || '';
  $('project').hidden = !order.project;

  var due = when(order.delivery);
  $('rows').innerHTML =
    row('Solution', order.solution) +
    row('From', order.from) +
    row('Into', order.into) +
    numRow('Words', order.words ? order.words.toLocaleString('en-GB') : '') +
    numRow('Delivery', due ? due + ' · ' + dueWords(order.delivery) : '') +
    numRow('Total', order.total ? money(order.total, order.currency) : '') +
    numRow('Placed', when(order.received));

  $('answer').hidden = false;
}

function trouble(message) {
  var note = $('note');
  note.hidden = false;
  note.className = 'note bad';
  note.textContent = message;
  $('answer').hidden = true;
}

$('lookup').addEventListener('submit', function (event) {
  event.preventDefault();
  var reference = $('reference').value.trim();
  var email = $('email').value.trim();
  if (!reference || !email) return;

  var button = $('go');
  var was = button.textContent;
  button.disabled = true;
  button.textContent = 'Looking…';
  $('note').hidden = true;

  /* text/plain keeps this a simple request, so the browser asks for no
     preflight the web app cannot answer. */
  fetch(ORDERS_WEBHOOK, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'status', id: reference, email: email })
  }).then(function (res) {
    if (!res.ok) throw new Error('the desk answered ' + res.status);
    return res.json();
  }).then(function (answer) {
    if (answer && answer.ok) {
      show(answer.order);
      return;
    }
    /* The desk answers a wrong pair exactly as it answers an unknown one, so
       this page cannot be used to find out which references exist. */
    trouble('We cannot find an order with that reference and that email together. ' +
      'Check both against the confirmation we sent you.');
  }).catch(function (err) {
    trouble('We could not reach the desk just now: ' + (err && err.message ? err.message : err) +
      '. Try again in a moment.');
  }).then(function () {
    button.disabled = false;
    button.textContent = was;
  });
});

/* A link in the confirmation can carry the reference, so it arrives filled in. */
(function boot() {
  var match = /[?&]ref=([^&]+)/.exec(location.search);
  if (match) $('reference').value = decodeURIComponent(match[1]);
})();
</script>
</body>
</html>
